<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta property="og:title" content="Personal Portfolio">
    <meta property="og:description" content="My Personal Portfolio">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">

    <link lang='sass' rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/blog.css') }}">
    <link rel='icon' href='{{ url_for('static', filename='img/favicon.ico') }}' type='image/x-icon' />
    <title>{{ title }}</title>
</head>
<body>
    <header class="nav-bar">
        <div class="nav-content">
            <a href="/">
                <div class="nav-logo">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" />
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/hobbies">Hobbies</a></li>
                <li><a href="/experience">Experience</a></li>
                <li><a href="/map">Map</a></li>
                <li><a href="/timeline">Timeline</a></li>
                <li><a href="/blog">Blog</a></li>
            </ul>
        </div>
    </header>

    <div class="regular-title">
        <h1>{{ title }}</h1>
    </div>
    <div class="blog-list">
        {% for post in posts %}
        <a class="blog-card" href="{{ url_for('blog_post', slug=post.slug) }}">
            <h2>{{ post.title }}</h2>
            {% if post.date_display %}<p class="blog-card-date">{{ post.date_display }}</p>{% endif %}
            {% if post.summary %}<p class="blog-card-summary">{{ post.summary }}</p>{% endif %}
        </a>
        {% else %}
        <p>No posts yet — check back soon!</p>
        {% endfor %}
    </div>

</body>
</html>
